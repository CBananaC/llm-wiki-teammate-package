     標題用 serif、標籤用 sans。 */
  :root {
    --ink: #163d3f; --text: #3c5754;
    --paper: #f4efe6; --card: #fffaf2;
    --line: rgba(22, 61, 63, .18); --muted: #6d756f;
    --accent: #c45d38;
    --serif: "Noto Serif TC","Source Han Serif TC","PMingLiU",Georgia,serif;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", sans-serif;
    --c-events: #b5462e; --c-official: #2f75b5; --c-imperial: #c46a2b; --c-emperor: #7d4ab8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 48px 24px 96px; color: var(--text); font: 500 14px/1.6 var(--sans);
    background: radial-gradient(circle at 84% 0%, rgba(196, 93, 56, .07), transparent 25rem), var(--paper);
  }
  h1 { margin: 0 0 8px; color: var(--ink); font: 500 30px/1.15 var(--serif); letter-spacing: -.035em; }
  .lead { max-width: 680px; margin: 0 0 34px; color: var(--muted); font: 500 14px/1.8 var(--serif); }

  .qrow { display: flex; flex-wrap: wrap; gap: 26px; justify-content: center; }
  .qcard {
    width: 470px; max-width: 100%; padding: 18px;
    background: var(--card); border: 1px solid var(--line);
    box-shadow: 0 12px 28px rgba(22, 61, 63, .12);
  }
  .qcard svg { display: block; width: 100%; height: auto; aspect-ratio: 1 / 1; }
</style>

<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OCR 並結構化原始史料｜封面草稿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Serif+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --deep-teal: #102f32;
      --deep-teal-2: #183d3f;
      --paper: #f5f0e6;
      --paper-soft: rgba(245, 240, 230, .72);
      --ink: #ecf0e8;
      --muted: rgba(236, 240, 232, .68);
      --line: rgba(238, 245, 235, .38);
      --warm: #d6a66a;
      --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
      --sans: Inter, "PingFang TC", "Helvetica Neue", sans-serif;
    }

    * { box-sizing: border-box; }

    html {
      overflow-x: clip;
      background: var(--deep-teal);
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 77% 48%, rgba(92, 145, 133, .23), transparent 29rem),
        linear-gradient(119deg, var(--deep-teal) 0%, #12383a 48%, var(--deep-teal-2) 100%);
      font-family: var(--sans);
      overflow-x: clip;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      content: "";
      opacity: .32;
      background-image:
        linear-gradient(rgba(255, 255, 255, .025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .02) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: linear-gradient(90deg, black, transparent 80%);
    }

    .cover {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, 47vw);
      align-items: center;
      min-height: 100svh;
      padding: clamp(48px, 8vh, 104px) clamp(28px, 7vw, 112px) clamp(38px, 6vh, 72px);
      isolation: isolate;
      overflow: clip;
    }

    .cover::after {
      position: absolute;
      inset: 6vh 4vw 6vh 4vw;
      z-index: -1;
      pointer-events: none;
      border: 1px solid rgba(236, 240, 232, .12);
      content: "";
    }

    .settings {
      position: fixed;
      top: clamp(18px, 3vw, 34px);
      right: clamp(18px, 3vw, 42px);
      z-index: 10;
    }

    .settings-button {
      display: grid;
      width: 52px;
      height: 52px;
      padding: 0;
      place-items: center;
      color: var(--ink);
      cursor: pointer;
      border: 1px solid rgba(236, 240, 232, .44);
      border-radius: 3px;
      background: rgba(16, 47, 50, .7);
      box-shadow: 0 12px 30px rgba(0, 0, 0, .18);
      font: 500 22px/1 var(--sans);
      transition: background .2s ease, border-color .2s ease, transform .2s ease;
    }

    .settings-button:hover,
    .settings-button:focus-visible {
      outline: none;
      border-color: rgba(236, 240, 232, .85);
      background: rgba(44, 84, 83, .88);
      transform: translateY(-2px);
    }

    .settings-panel {
      position: absolute;
      top: 0;
      right: 64px;
      display: none;
      width: min(260px, calc(100vw - 36px));
      padding: 18px;
      color: var(--deep-teal);
      border: 1px solid rgba(16, 47, 50, .18);
      border-radius: 3px;
      background: rgba(245, 240, 230, .97);
      box-shadow: 0 18px 45px rgba(0, 0, 0, .26);
    }

    .settings-panel.is-open { display: block; }

    .settings-panel strong,
    .settings-panel label {
      display: block;
      font-family: var(--serif);
    }

    .settings-panel strong {
      margin-bottom: 12px;
      font-size: 18px;
      letter-spacing: .08em;
    }

    .settings-panel label {
      margin-bottom: 7px;
      font-size: 14px;
    }

    .settings-panel input {
      width: 100%;
      accent-color: var(--deep-teal);
    }

    .cover-copy {
      position: relative;
      z-index: 5;
      width: min(100%, 650px);
      padding: clamp(18px, 2vw, 28px) clamp(20px, 3vw, 42px) clamp(28px, 4vw, 50px) 0;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 27px;
      color: var(--warm);
      font: 600 12px/1.2 var(--sans);
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 40px;
      height: 1px;
      background: var(--warm);
      content: "";
    }

    h1 {
      max-width: 12em;
      margin: 0;
      color: var(--paper);
      font: 700 clamp(50px, 6vw, 94px)/1.1 var(--serif);
      letter-spacing: .045em;
      text-wrap: balance;
      text-shadow: 0 4px 26px rgba(0, 0, 0, .18);
    }

    .intro {
      max-width: 31em;
      margin: 30px 0 0;
      color: var(--muted);
      font: 400 clamp(15px, 1.25vw, 18px)/1.9 var(--serif);
      letter-spacing: .04em;
    }

    .source-meta {
      display: grid;
      gap: 6px;
      margin: 38px 0 0;
      padding-left: 18px;
      border-left: 1px solid var(--warm);
      color: var(--paper-soft);
      font: 400 clamp(14px, 1.2vw, 17px)/1.7 var(--serif);
      letter-spacing: .06em;
    }

    .source-meta strong {
      color: var(--paper);
      font-weight: 600;
    }

    .cover-actions {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 42px;
    }

    .start-link {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      min-height: 48px;
      padding: 0 19px;
      color: var(--deep-teal);
      text-decoration: none;
      background: var(--paper);
      font: 600 14px/1 var(--serif);
      letter-spacing: .09em;
      transition: background .2s ease, transform .2s ease;
    }

    .start-link::after {
      color: #956e3e;
      content: "→";
      font: 20px/1 var(--sans);
    }

    .start-link:hover,
    .start-link:focus-visible {
      outline: none;
      background: #fffdf7;
      transform: translateY(-2px);
    }

    .draft-note {
      color: rgba(236, 240, 232, .52);
      font: 400 11px/1.5 var(--sans);
      letter-spacing: .08em;
    }

    .source-watermark {
      position: relative;
      z-index: 2;
      align-self: stretch;
      display: grid;
      min-height: min(81vh, 780px);
      margin: 0;
      place-items: center;
    }

    .source-ghost {
      position: absolute;
      top: 50%;
      right: 0;
      width: min(100%, 585px);
      height: min(85vh, 800px);
      transform: translateY(-50%) rotate(2.5deg);
      filter: drop-shadow(0 18px 35px rgba(0, 0, 0, .11));
    }

    .source-ghost::before {
      display: none;
    }

    .source-page {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: .34;
    }

    .source-page.edge {
      transform: translate(1px, 1px);
      opacity: .12;
      filter: blur(.25px);
    }

    .source-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .word-lines {
      position: absolute;
      inset: 6% 4%;
      pointer-events: none;
      opacity: .24;
      background-image:
        repeating-linear-gradient(90deg, transparent 0 31px, rgba(255, 255, 255, .55) 31px 32px, transparent 32px 65px),
        repeating-linear-gradient(0deg, transparent 0 29px, rgba(255, 255, 255, .28) 29px 30px, transparent 30px 59px);
      mix-blend-mode: screen;
      mask-image: linear-gradient(90deg, transparent, black 17%, black 82%, transparent);
    }

    .source-frame {
      position: absolute;
      inset: 4% 2% 4% 13%;
      border: 1px solid rgba(236, 240, 232, .22);
      pointer-events: none;
    }

    .source-frame::before,
    .source-frame::after {
      position: absolute;
      width: 17px;
      height: 17px;
      border-color: rgba(236, 240, 232, .7);
      content: "";
    }

    .source-frame::before {
      top: -1px;
      left: -1px;
      border-top: 1px solid;
      border-left: 1px solid;
    }

    .source-frame::after {
      right: -1px;
      bottom: -1px;
      border-right: 1px solid;
      border-bottom: 1px solid;
    }

    .source-caption {
      position: absolute;
      right: 3%;
      bottom: 1%;
      z-index: 4;
      display: grid;
      gap: 4px;
      max-width: 290px;
      color: rgba(245, 240, 230, .72);
      font: 400 11px/1.5 var(--serif);
      letter-spacing: .07em;
      text-align: right;
    }

    .source-caption strong {
      color: var(--paper);
      font-weight: 500;
    }

    .cover-footer {
      position: absolute;
      right: clamp(28px, 7vw, 112px);
      bottom: clamp(22px, 4vh, 44px);
      left: clamp(28px, 7vw, 112px);
      z-index: 5;
      display: flex;
      justify-content: space-between;
      color: rgba(236, 240, 232, .45);
      font: 500 10px/1.4 var(--sans);
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .scroll-cue::after {
      display: inline-block;
      width: 36px;
      height: 1px;
      margin-left: 12px;
      vertical-align: middle;
      background: rgba(236, 240, 232, .45);
      content: "";
    }

    @media (max-width: 940px) {
      .cover {
        grid-template-columns: minmax(0, 1fr) minmax(270px, 43vw);
        padding-right: 5vw;
        padding-left: 5vw;
      }

      h1 { font-size: clamp(46px, 6.6vw, 72px); }
      .source-ghost { right: -7%; }
      .source-caption { right: -3%; }
      .cover-footer { right: 5vw; left: 5vw; }
    }

    @media (max-width: 720px) {
      .cover {
        display: block;
        min-height: 100svh;
        padding: 100px 28px 100px;
      }

      .cover::after {
        inset: 82px 16px 58px;
      }

      .cover-copy {
        width: min(100%, 550px);
        padding: 0;
      }

      h1 {
        max-width: 8em;
        font-size: clamp(45px, 14vw, 70px);
      }

      .intro {
        max-width: 26em;
        margin-top: 24px;
      }

      .source-meta { margin-top: 27px; }
      .cover-actions { margin-top: 30px; }

      .source-watermark {
        position: absolute;
        right: 0;
        bottom: 35px;
        left: 12%;
        min-height: 0;
        height: 52vh;
        opacity: .64;
        pointer-events: none;
      }

      .source-ghost {
        top: 50%;
        right: 2%;
        width: 98%;
        height: 100%;
        transform: translateY(-50%) rotate(1deg);
      }

      .source-caption { bottom: -2%; }
      .cover-footer { bottom: 24px; }
      .draft-note { display: none; }
    }

    @media (max-width: 470px) {
      .settings-button { width: 46px; height: 46px; }
      .settings-panel { top: 0; right: 56px; width: min(210px, calc(100vw - 82px)); }
      .cover { padding-right: 24px; padding-left: 24px; }
      h1 { font-size: clamp(43px, 15vw, 62px); }
      .intro { font-size: 14px; }
      .source-meta { font-size: 13px; }
      .source-watermark { right: 0; left: 5%; bottom: 42px; height: 45vh; }
      .source-ghost { right: 2%; width: 98%; }
      .source-caption { right: 8%; max-width: 180px; font-size: 10px; }
      .cover-footer { right: 24px; bottom: 20px; left: 24px; }
      .cover-footer .scroll-cue { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="settings">
    <button class="settings-button" type="button" aria-label="開啟介面設定" aria-expanded="false" aria-controls="settings-panel">⚙</button>
    <div class="settings-panel" id="settings-panel" aria-hidden="true">
      <strong>介面設定</strong>
      <label for="type-scale">介面字級</label>
      <input id="type-scale" type="range" min="90" max="112" value="100" aria-label="介面字級">
    </div>
  </div>

  <main class="cover" aria-labelledby="cover-title">
    <section class="cover-copy">
      <p class="eyebrow">PRIMARY SOURCE / OCR WORKFLOW</p>
      <h1 id="cover-title">OCR 並結構化原始史料</h1>
      <p class="intro">從一頁清代奏摺開始，辨識文字、整理欄位，讓原始史料成為可閱讀、可檢索、可核驗的資料。</p>

      <div class="source-meta" aria-label="示範史料資訊">
        <span><strong>示範史料</strong>　黃仕簡，〈為奏彰化失陷已調兵赴臺事〉</span>
        <span>乾隆五十一年十二月初十日（1786/12/10）</span>
      </div>

      <div class="cover-actions">
        <a class="start-link" href="#source-preview">查看史料</a>
        <span class="draft-note">封面構圖草稿｜右側為文字抽取視覺示意</span>
      </div>
    </section>

    <figure class="source-watermark" id="source-preview" aria-label="黃仕簡手寫原始史料第一頁的文字抽取水印示意">
      <div class="source-ghost" aria-hidden="true">
        <img class="source-input" src="../storymap/試一試/手寫字/page1.png" alt="">
        <canvas class="source-page" data-ink-canvas></canvas>
        <canvas class="source-page edge" data-ink-canvas></canvas>
        <div class="word-lines"></div>
        <div class="source-frame"></div>
      </div>
      <figcaption class="source-caption">
        <strong>文字抽取／細線浮印示意</strong>
        <span>硃25｜手寫史料第一頁</span>
      </figcaption>
    </figure>

    <footer class="cover-footer" aria-label="封面資訊">
      <span>OCR / 01</span>
      <span class="scroll-cue">SCROLL TO EXPLORE</span>
    </footer>
  </main>

  <script>
    const settingsButton = document.querySelector('.settings-button');
    const settingsPanel = document.querySelector('#settings-panel');
    const typeScale = document.querySelector('#type-scale');
    const sourceInput = document.querySelector('.source-input');
    const inkCanvases = [...document.querySelectorAll('[data-ink-canvas]')];

    // Turn the supplied handwritten PDF page into a text-only transparent layer:
    // light paper, folds, and the scan background become transparent; dark ink
    // becomes a soft white stroke for the cover watermark.
    function renderInkOnly() {
      if (!sourceInput.naturalWidth || !sourceInput.naturalHeight) return;

      const width = sourceInput.naturalWidth;
      const height = sourceInput.naturalHeight;
      const scratch = document.createElement('canvas');
      scratch.width = width;
      scratch.height = height;
      const context = scratch.getContext('2d', { willReadFrequently: true });
      context.drawImage(sourceInput, 0, 0, width, height);

      const pixels = context.getImageData(0, 0, width, height);
      for (let index = 0; index < pixels.data.length; index += 4) {
        const luminance = (pixels.data[index] * .299)
          + (pixels.data[index + 1] * .587)
          + (pixels.data[index + 2] * .114);
        const darkness = 255 - luminance;
        const strength = Math.max(0, Math.min(1, (darkness - 88) / 88));
        const alpha = Math.round(Math.pow(strength, 1.35) * 255);

        pixels.data[index] = 255;
        pixels.data[index + 1] = 255;
        pixels.data[index + 2] = 255;
        pixels.data[index + 3] = alpha;
      }

      inkCanvases.forEach((canvas) => {
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').putImageData(pixels, 0, 0);
      });
    }

    if (sourceInput.complete) renderInkOnly();
    else sourceInput.addEventListener('load', renderInkOnly, { once: true });

    settingsButton.addEventListener('click', () => {
      const open = settingsPanel.classList.toggle('is-open');
      settingsButton.setAttribute('aria-expanded', String(open));
      settingsPanel.setAttribute('aria-hidden', String(!open));
    });

    typeScale.addEventListener('input', (event) => {
      document.documentElement.style.fontSize = `${event.target.value}%`;
    });

    document.addEventListener('click', (event) => {
      if (!event.target.closest('.settings')) {
        settingsPanel.classList.remove('is-open');
        settingsButton.setAttribute('aria-expanded', 'false');
        settingsPanel.setAttribute('aria-hidden', 'true');
      }
    });
  </script>
</body>
</html>

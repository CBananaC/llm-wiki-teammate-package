<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>諭43／硃160 引文比對 — 草稿視覺（未接入正式頁面）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /*
    草稿說明（給日後接入 storymap-example.html 的人看）：
    - 這是「辨識奏摺所回應的上諭」卡片堆疊中第三張卡片
      （系統會根據三項條件篩選候選文書……）右側要放的新視覺草稿。
    - 尚未接入正式頁面／storymap-cards.css／storymap.js，是獨立單檔案，
      方便先審視互動與配色，再比照 storymap-layer3-cover-ideas.html
      的作法搬進正式版面。
    - 文書面板的外觀（badge、標題列、視窗控制圖示、內文區）改為比照
      platform-interface-replica.html 實際載入的 part-1-interface.css／
      part-1-interface.js 中 .part1-doc / .part1-doc-head /
      .part1-doc-window-btn / .part1-doc-scroll / .part1-doc-body 與
      mark 標記的樣式與 class 命名（此檔案自成一體，未直接引入那份
      CSS，是抄錄對應規則後自行 scope，避免拉入整份不相關的樣式）。
    - 內文逐字取自 review-tools/shared data/stage1_original_text.json
      （doc_id: 諭43、doc_id: 硃160），兩側均為「全文」，未新增、未
      改寫任何字句；已用程式逐字核對兩側重組後的文字與來源 JSON 的
      body 欄位完全一致。
  */
  :root {
    --ink: #163d3f; --text: #3c5754;
    --paper: #f4efe6; --card: #fffaf2; --line: rgba(22, 61, 63, .18);
    --accent: #c45d38; --sample-orange: #c86138; --sample-teal: #315d5d;
    --serif: "Noto Serif TC", "Source Han Serif TC", "PMingLiU", Georgia, serif;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 36px 20px 70px; background: var(--paper); font-family: var(--sans); color: var(--ink); }
  .wrap { max-width: 1180px; margin: 0 auto; }

  .evidence-visual {
    margin: 0; padding: 20px;
    background: #e8dfd1; border: 1px solid var(--line); border-radius: 4px;
  }
  .evidence-stage {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr);
    gap: 18px; align-items: stretch;
  }

  /* -------- .part1-doc 風格文書面板（照抄 platform-interface-replica.html
     實際載入的 part-1-interface.css／part-1-interface.js 規則） -------- */
  .part1-doc {
    display: flex; flex-direction: column; min-width: 0;
    background: var(--card);
    border: 1px solid #e3d9c7; border-radius: 6px;
    box-shadow: 0 10px 22px rgba(47, 57, 52, .16);
    overflow: hidden;
  }
  .part1-doc.is-primary { border-color: #c9a98c; box-shadow: 0 16px 32px rgba(47, 57, 52, .24); }

  .part1-doc-head {
    position: relative;
    padding: 11px 12px 9px;
    background: linear-gradient(#fffdf8, #f2ebdf);
    border-bottom: 1px solid #e1d8c9;
  }
  .part1-doc-window-controls {
    position: absolute; top: 9px; right: 8px;
    display: flex; gap: 6px; color: #a99d8b;
  }
  .part1-doc-window-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 27px; height: 27px; padding: 2px;
    color: #a39785; background: transparent; border: 0; border-radius: 5px;
    cursor: default;
  }
  .part1-chat-svg { display: block; width: 20px; height: 20px; }

  .part1-doc-title { margin: 0 0 5px; padding-right: 90px; color: var(--ink); font: 700 15px/1.4 var(--serif); }
  .part1-doc-title .badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin-right: 7px;
    color: #fffaf2; background: var(--sample-orange);
    border-radius: 5px; vertical-align: -6px; font: 800 14px/1 var(--serif);
  }
  .part1-doc-meta { margin: 0; color: #7a6f63; font: 500 11.5px/1.65 var(--sans); }

  .part1-doc-scroll { flex: 1 1 auto; min-height: 0; max-height: 640px; overflow-y: auto; padding: 14px 16px 20px; }
  .part1-doc-body {
    margin: 0; color: var(--text); text-align: justify;
    font: 500 15px/2 var(--serif);
  }

  /* -------- mark 標記：三色重點（同一份規則，兩側共用） -------- */
  .part1-doc-body mark {
    padding: 1px 2px; color: inherit; background: transparent;
    border-radius: 3px; box-decoration-break: clone; -webkit-box-decoration-break: clone;
    transition: background-color .25s, box-shadow .25s;
  }
  .part1-doc-body mark[data-hl="marker"] { background: rgba(243, 201, 103, .55); cursor: pointer; }
  .part1-doc-body mark[data-hl="date"] { background: rgba(111, 163, 163, .38); cursor: pointer; }
  .part1-doc-body mark[data-hl="quote"] { background: rgba(217, 138, 99, .34); cursor: pointer; }
  .part1-doc-body mark[data-hl]:hover { filter: brightness(.94); }
  .part1-doc-body mark.is-picked { box-shadow: 0 0 0 2px var(--ink) inset; }

  /* 諭43 側目標：預設透明，點擊後套用「is-located」效果（沿用平台
     圖表定位到原文時使用的同一組視覺語言：亮黃底 + 光暈外框），
     並加上一次性的擴散脈動，讓「被指到」的動作更明顯。 */
  .part1-doc-body mark[data-target] { background: transparent; }
  .part1-doc-body mark[data-target].is-located {
    background: #f7dc8a;
    box-shadow: 0 0 0 2px rgba(217, 164, 65, .55);
    animation: locate-pulse .6s ease-out;
  }
  @keyframes locate-pulse {
    0% { box-shadow: 0 0 0 2px rgba(217, 164, 65, .55), 0 0 0 0 rgba(217, 164, 65, .55); }
    100% { box-shadow: 0 0 0 2px rgba(217, 164, 65, .55), 0 0 0 10px rgba(217, 164, 65, 0); }
  }

  @media (max-width: 900px) {
    .evidence-stage { grid-template-columns: 1fr; }
    .part1-doc-scroll { max-height: 420px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <figure class="evidence-visual" aria-label="以諭43／硃160為例，示範三項篩選條件如何在原文中互相對應">
    <div class="evidence-stage">

      <!-- 左：諭43（上諭） -->
      <div class="part1-doc" id="panelYu">
        <div class="part1-doc-head">
          <div class="part1-doc-window-controls">
            <span class="part1-doc-window-btn" aria-hidden="true"><svg class="part1-chat-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg></span>
            <span class="part1-doc-window-btn" aria-hidden="true"><svg class="part1-chat-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
            <span class="part1-doc-window-btn" aria-hidden="true"><svg class="part1-chat-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></span>
          </div>
          <p class="part1-doc-title"><span class="badge">諭</span>諭43｜諭兩廣總督孫士毅毋庸親往潮州</p>
          <p class="part1-doc-meta">大學士公阿桂、大學士和珅 字寄兩廣總督孫（士毅）<br>發佈 乾隆五十二年正月十三日（1787/01/13）<br>《天地會》1，頁231</p>
        </div>
        <div class="part1-doc-scroll">
          <p class="part1-doc-body" id="yuBody">大學士公阿、大學士和，字寄兩廣總督孫，<mark data-target="a">乾隆五十二年正月十三日奉上諭</mark>：<mark data-target="b">據孫士毅奏，接準閩省諮文，挑備水師戰兵一千名，立即起程，前赴南澳，以資策應。並知會署提臣彭承堯，先赴潮州稽查彈壓</mark>，數日內略爲料理地方事務，即親赴潮州駐紮，以便就近辦理等語，已於折內詳悉批示。<mark data-target="b">閩粵境壤毗連，臺匪糾衆滋事，孫士毅接準諮文，派兵前往預備策應，及嚴飭各隘口，嚴密盤潔，遇有形跡可疑之人，立即究辦。此係當辦之事。</mark>至林爽文不過一烏合之衆，無難速就撲滅。前因該省水陸兩提督概行渡臺，朕尚以爲過當。<mark data-target="b">孫士毅系鄰省總督，止當鎮靜地方，密飭各隘口堵拿逸犯，豈得輕離省城，以致粵東內地民人心懷疑惑。</mark>外省各督撫遇有此等事件，每以親身前往，見其急公，而不權事理之輕重緩急。督撫固不可養尊處優，身耽安逸，然當鎮靜辦理之事，亦不可過涉張皇，斷無因一二賊匪騷動各省之理。<mark data-target="b">著傳諭孫士毅，此時如尚未起程，即毋庸前往。若業已起程，亦即回省城。</mark>潮州現有彭承堯在彼，盡足以資彈壓。若續得閩省臺地信息，即行迅速具奏。將此由六百里加緊諭令知之。欽此。遵旨寄信前來。</p>
        </div>
      </div>

      <!-- 右：硃160（硃批，全文） -->
      <div class="part1-doc is-primary" id="panelZhu">
        <div class="part1-doc-head">
          <div class="part1-doc-window-controls">
            <span class="part1-doc-window-btn" aria-hidden="true"><svg class="part1-chat-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg></span>
            <span class="part1-doc-window-btn" aria-hidden="true"><svg class="part1-chat-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
            <span class="part1-doc-window-btn" aria-hidden="true"><svg class="part1-chat-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></span>
          </div>
          <p class="part1-doc-title"><span class="badge">硃</span>硃160｜為奏料理撤兵及回省日期事</p>
          <p class="part1-doc-meta">孫士毅（兩廣總督兼署廣東巡撫）<br>發出 乾隆五十二年正月二十六日　·　奉硃批 乾隆五十二年二月十四日<br>明清台檔30，頁329</p>
        </div>
        <div class="part1-doc-scroll">
          <p class="part1-doc-body">兩廣總督兼署廣東巡撫臣孫士毅跪奏，為遵旨起程回省，恭摺奏覆事竊臣於上年十二月二十四日具奏，接准閩省咨文，挑備戰兵以資策應一摺，本年正月二十四日敬奉硃批：「另有旨諭。」欽此。同日，<mark data-hl="marker">接奉廷寄</mark><mark data-hl="date">乾隆五十二年正月十三日</mark><mark data-hl="marker">奉上諭</mark>：「<mark data-hl="quote">據孫士毅奏，接准閩省咨文，挑備水師戰兵一千名，立即起程前赴南澳，以資策應，並知會署提臣彭承堯先赴潮州稽查彈壓。等語。閩粵境壤毗連，臺匪糾眾滋事，各隘口嚴密盤詰，此係當辦之事。孫士毅止當鎮靜地方，密飭隘口堵拿逸犯，豈得輕離省城，以致內地民人心懷疑惑。著孫士毅如尚未起程，即毋庸前往。若已起程，亦即速回省城。</mark>」等因。欽此。臣跪讀之下，仰見我皇上睿謨廣運，坐照無遺，萬里情形，洞如觀火。臣才庸識淺，不知輕重緩急，惑於漳、潮壤接，民情疑恐，親赴彈壓。一經聖明詳晰指示，臣自知錯謬，不禁慚悚交集（硃批：此時又當前往，爾等總不知機要，奈何）。茲臣雖未得閩省剿滅逆匪之信，但據報水陸兩提臣齊抵臺灣，逆賊漸已逃竄，自可即日蕩平。臣已於正月二十一日起，先將督標官兵陸續撤回歸五。其先赴閩省之水師一千名，昨准閩浙督臣知會，現在暫駐漳州，用資彈壓。其駐紮黃崗等處水陸兵丁，臣現與署提臣彭承堯商酌，俟再得閩省剿賊確信。察看漳、潮交界處所，民情十分寧貼，亦即分起撤回。惟粵省惠、潮民人入天地會者，諒復不少，此種匪會，現有攻城殺官之事，非別項邪教止圖誆騙錢財者可比，必須徹底查辦，淨絕根株。其從外竄逃入境及內地勾引入會之人，均應一一搜捕，不留餘孽。臬司姚棻現已行調來潮，專司督緝，俟有續獲，另容隨時訊供具奏。一切稽查防範事宜，臣遵旨交與署提臣彭承堯，暫駐潮州督率料理。臣即於正月二十六日起程回省，仍俟續得臺地信息，隨時由驛迅速奏聞。所有臣欽奉諭旨，現在料理撤兵緝匪及起程回省日期，理合由驛四百里覆奏，伏乞皇上睿鑒。謹奏。<br><br>乾隆五十二年正月二十六日<br>乾隆五十二年二月十四日奉硃批：已有旨了。欽此。〔本文原收錄於軍錄】</p>
        </div>
      </div>

    </div>
  </figure>
</div>
<script>
  (function () {
    var zhuMarks = Array.prototype.slice.call(document.querySelectorAll('#panelZhu mark[data-hl]'));
    var yuBody = document.getElementById('yuBody');

    function clearActive() {
      zhuMarks.forEach(function (el) { el.classList.remove('is-picked'); });
      yuBody.querySelectorAll('mark[data-target]').forEach(function (el) { el.classList.remove('is-located'); });
    }

    function activateGroup(group) {
      var targetKey = (group === 'quote') ? 'b' : 'a';
      clearActive();
      zhuMarks.filter(function (el) { return el.dataset.hl === group; })
        .forEach(function (el) { el.classList.add('is-picked'); });
      var targets = yuBody.querySelectorAll('mark[data-target="' + targetKey + '"]');
      targets.forEach(function (el, i) {
        // 重新觸發一次性脈動動畫
        el.classList.remove('is-located');
        void el.offsetWidth;
        el.classList.add('is-located');
      });
      if (targets.length) targets[0].scrollIntoView({ block: 'center', behavior: 'smooth' });
    }

    zhuMarks.forEach(function (el) {
      el.addEventListener('click', function () { activateGroup(el.dataset.hl); });
    });
  })();
</script>
</body>

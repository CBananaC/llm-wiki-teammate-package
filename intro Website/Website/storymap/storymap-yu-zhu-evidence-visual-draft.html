<style>
  /*
    草稿說明（給日後接入 storymap-example.html 的人看）：
    - 這是「辨識奏摺所回應的上諭」卡片堆疊中第三張卡片
      （系統會根據三項條件篩選候選文書……）右側要放的新視覺草稿。
    - 尚未接入正式頁面／storymap-cards.css／storymap.js，是獨立單檔案，
      方便先審視互動與配色，再比照 storymap-layer3-cover-ideas.html
      的作法搬進正式版面。
    - 文書面板的外觀（badge、標題列、視窗控制圖示、內文區）比照
      platform-interface-replica.html 實際載入的 part-1-interface.css／
      part-1-interface.js 中 .part1-doc 系列規則抄錄後自行 scope。
    - 內文逐字取自 review-tools/shared data/stage1_original_text.json
      （doc_id: 諭43、doc_id: 硃160），兩側均為「全文」，未新增、未
      改寫任何字句；已用程式逐字核對兩側重組後的文字與來源 JSON 的
      body 欄位完全一致（本次僅調整版面／互動，未再更動文字內容）。
    - 互動：預設只顯示硃160（在右）。諭43是與硃160「同尺寸、同高度」
      的面板，固定疊在硃160左側同一水平線上，初始寬度為 0（右邊界
      固定貼齊硃160左邊，完全不可見）。第一次點擊硃160任一標色文字
      時，諭43才會從右邊界往左邊界展開（寬度 0 → 與硃160相同），
      展開後逐字打出內文；此展開＋打字動畫只播放一次，之後再點其他
      標色文字，只切換諭43內已打好文字中的亮點，不會重播動畫。重新
      整理頁面會重置成初始狀態。
    - 版面：整組（文字卡＋雙面板）比照正式頁面「文字卡在左、視覺在
      右」的排法，此檔內附上第三張卡片原句作對照，方便確認位置。
  */
  :root {
    --ink: #163d3f; --text: #3c5754;
    --paper: #f4efe6; --card: #fffaf2; --line: rgba(22, 61, 63, .18);
    --accent: #c45d38; --sample-orange: #c86138; --sample-teal: #315d5d;
    --yellow: #f3c967;
    --hl-a: 58, 122, 122;   /* 標記＋日期／目標A：藍綠色系，同一對用同一色 */
    --hl-b: 196, 93, 56;    /* 引文／目標B：磚橘色系，同一對用同一色 */
    --panel-w: 430px;
    --panel-gap: 22px;
    --serif: "Noto Serif TC", "Source Han Serif TC", "PMingLiU", Georgia, serif;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 36px 20px 70px; background: var(--paper); font-family: var(--sans); color: var(--ink); }
  .wrap { max-width: 1320px; margin: 0 auto; }

  .demo-row {
    display: grid;
    grid-template-columns: minmax(240px, 320px) 1fr;
    gap: 28px; align-items: start;
  }
  .context-card {
    margin: 0; padding: 18px 20px;
    background: var(--card); border: 1px solid var(--line); border-radius: 4px;
  }
  .context-card p { margin: 0; color: var(--text); font: 500 15.5px/1.85 var(--serif); }

  .evidence-visual {
    margin: 0; padding: 44px 20px 20px;
    background: #e8dfd1; border: 1px solid var(--line); border-radius: 4px;
    overflow-x: auto;
  }
  .evidence-stage {
    position: relative;
    width: calc(var(--panel-w) * 2 + var(--panel-gap));
    height: 560px;
  }

  /* -------- .part1-doc 風格文書面板（同尺寸、同高度，左右並排） -------- */
  .part1-doc {
    display: flex; flex-direction: column; min-width: 0;
    background: var(--card);
    border: 1px solid #e3d9c7; border-radius: 6px;
    box-shadow: 0 10px 22px rgba(47, 57, 52, .16);
    overflow: hidden;
  }
  /* 硃160：初始佔滿整個舞台寬度（較寬，單獨顯示）；第一次展開時
     收縮為與諭43相同的寬度，兩者變成 50:50 並排。 */
  #panelZhu {
    position: absolute; top: 0; right: 0; width: 100%; height: 100%;
    transition: width .5s cubic-bezier(.22, 1, .36, 1);
  }
  #panelZhu.is-shown { width: var(--panel-w); }
  #panelYu {
    position: absolute; top: 0; right: calc(var(--panel-w) + var(--panel-gap)); z-index: 4;
    width: 0; height: 100%;
    box-shadow: 0 14px 28px rgba(47, 57, 52, .18);
    transition: width .5s cubic-bezier(.22, 1, .36, 1);
  }
  #panelYu.is-shown { width: var(--panel-w); }

  .part1-doc-head {
    position: relative;
    padding: 11px 12px 9px;
    background: linear-gradient(#fffdf8, #f2ebdf);
    border-bottom: 1px solid #e1d8c9;
  }
  .part1-doc-window-controls {
    position: absolute; top: 9px; right: 8px;
    display: flex; gap: 6px; color: #a99d8b;
  }
  .part1-doc-window-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 27px; height: 27px; padding: 2px;
    color: #a39785; background: transparent; border: 0; border-radius: 5px;
    cursor: default;
  }
  .part1-chat-svg { display: block; width: 20px; height: 20px; }

  .part1-doc-title { margin: 0 0 5px; padding-right: 90px; color: var(--ink); font: 700 16.5px/1.4 var(--serif); }
  .part1-doc-title .badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 27px; height: 27px; margin-right: 7px;
    color: #fffaf2; background: var(--sample-orange);
    border-radius: 5px; vertical-align: -6px; font: 800 14.5px/1 var(--serif);
  }
  .part1-doc-meta { margin: 0; color: #7a6f63; font: 500 12.5px/1.65 var(--sans); }

  .part1-doc-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 14px 16px 20px; }
  .part1-doc-body {
    margin: 0; color: var(--text); text-align: justify;
    font: 500 16.5px/2.05 var(--serif);
  }

  /* -------- mark 標記：無邊框，僅用深淺度區分狀態，同一對配色一致 -------- */
  .part1-doc-body mark {
    padding: 0 1px; color: inherit; background: transparent; border-radius: 3px;
    box-decoration-break: clone; -webkit-box-decoration-break: clone;
    transition: background-color .2s ease;
  }
  .part1-doc-body mark[data-hl="marker"],
  .part1-doc-body mark[data-hl="date"] { background: rgba(var(--hl-a), .22); cursor: pointer; }
  .part1-doc-body mark[data-hl="marker"]:hover,
  .part1-doc-body mark[data-hl="date"]:hover { background: rgba(var(--hl-a), .38); }
  .part1-doc-body mark[data-hl="marker"].is-picked,
  .part1-doc-body mark[data-hl="date"].is-picked { background: rgba(var(--hl-a), .6); }

  .part1-doc-body mark[data-hl="quote"] { background: rgba(var(--hl-b), .2); cursor: pointer; }
  .part1-doc-body mark[data-hl="quote"]:hover { background: rgba(var(--hl-b), .36); }
  .part1-doc-body mark[data-hl="quote"].is-picked { background: rgba(var(--hl-b), .58); }

  /* 諭43 側目標：預設無底色，點擊後套用與觸發方同色的深色調，並做
     一次性的「由深轉淺」閃現效果——純靠背景色深淺，不使用邊框。 */
  .part1-doc-body mark[data-target] { background: transparent; }
  .part1-doc-body mark[data-target="a"].is-active { background: rgba(var(--hl-a), .55); animation: hl-flash-a .55s ease-out; }
  .part1-doc-body mark[data-target="b"].is-active { background: rgba(var(--hl-b), .52); animation: hl-flash-b .55s ease-out; }
  @keyframes hl-flash-a { 0% { background: rgba(var(--hl-a), .9); } 100% { background: rgba(var(--hl-a), .55); } }
  @keyframes hl-flash-b { 0% { background: rgba(var(--hl-b), .85); } 100% { background: rgba(var(--hl-b), .52); } }

  /* -------- 提示泡泡：指向第一個可點的標色文字 -------- */
  .hint-bubble {
    position: absolute; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px;
    color: #4a2c12; background: var(--yellow);
    border-radius: 50%;
    font: 800 13px/1 var(--sans);
    box-shadow: 0 6px 14px rgba(0, 0, 0, .28);
    cursor: pointer;
    opacity: 0; transform: translate(-50%, -50%) scale(.4);
    pointer-events: none;
    transition: opacity .22s, transform .22s;
  }
  .hint-bubble.is-shown {
    opacity: 1; pointer-events: auto;
    animation: hint-bounce 1.1s ease-in-out infinite;
  }
  .hint-ring {
    position: absolute; inset: -7px; border-radius: 50%;
    border: 2px solid var(--yellow); opacity: 0;
  }
  .hint-bubble.is-shown .hint-ring { animation: hint-ping 1.6s ease-out infinite; }
  @keyframes hint-bounce {
    0%, 100% { transform: translate(-50%, -50%) scale(1) translateY(0); }
    50% { transform: translate(-50%, -50%) scale(1) translateY(-6px); }
  }
  @keyframes hint-ping {
    0% { opacity: .6; transform: scale(.75); }
    100% { opacity: 0; transform: scale(1.5); }
  }

  @media (max-width: 900px) {
    .demo-row { grid-template-columns: 1fr; }
  }
  @media (max-width: 720px) {
    .evidence-stage { width: 100%; height: auto; }
    #panelZhu, #panelYu {
      position: static; width: 100%; height: auto; max-height: 480px;
      box-shadow: 0 10px 22px rgba(47, 57, 52, .16);
    }
    #panelYu { margin-top: 16px; }
    .hint-bubble { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="demo-row">
    <article class="context-card">
      <p>系統會根據三項條件篩選候選文書。第一，上諭的發佈日期必須和「奉上諭」標記前的日期相符；第二，奏摺作者應為上諭的受文官員之一；第三，奏摺中的上諭引文必須與候選上諭的內容完全或大致相同。</p>
    </article>
  <figure class="evidence-visual" aria-label="以諭43／硃160為例，示範三項篩選條件如何在原文中互相對應">
    <div class="evidence-stage" id="stage">

      <!-- 右：硃160（硃批，全文，預設唯一顯示的面板） -->
      <div class="part1-doc" id="panelZhu">
        <div class="part1-doc-head">
          <div class="part1-doc-window-controls">
            <span class="part1-doc-window-btn" aria-hidden="true"><svg class="part1-chat-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg></span>
            <span class="part1-doc-window-btn" aria-hidden="true"><svg class="part1-chat-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
            <span class="part1-doc-window-btn" aria-hidden="true"><svg class="part1-chat-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></span>
          </div>
          <p class="part1-doc-title"><span class="badge">硃</span>為奏料理撤兵及回省日期事</p>
          <p class="part1-doc-meta">孫士毅（兩廣總督兼署廣東巡撫）<br>發出 乾隆五十二年正月二十六日　·　奉硃批 乾隆五十二年二月十四日<br>明清台檔30，頁329</p>
        </div>
        <div class="part1-doc-scroll">
          <p class="part1-doc-body" id="zhuBody">兩廣總督兼署廣東巡撫臣孫士毅跪奏，為遵旨起程回省，恭摺奏覆事竊臣於上年十二月二十四日具奏，接准閩省咨文，挑備戰兵以資策應一摺，本年正月二十四日敬奉硃批：「另有旨諭。」欽此。同日，<mark data-hl="marker">接奉廷寄</mark><mark data-hl="date">乾隆五十二年正月十三日</mark><mark data-hl="marker">奉上諭</mark>：「<mark data-hl="quote">據孫士毅奏，接准閩省咨文，挑備水師戰兵一千名，立即起程前赴南澳，以資策應，並知會署提臣彭承堯先赴潮州稽查彈壓。等語。閩粵境壤毗連，臺匪糾眾滋事，各隘口嚴密盤詰，此係當辦之事。孫士毅止當鎮靜地方，密飭隘口堵拿逸犯，豈得輕離省城，以致內地民人心懷疑惑。著孫士毅如尚未起程，即毋庸前往。若已起程，亦即速回省城。</mark>」等因。欽此。臣跪讀之下，仰見我皇上睿謨廣運，坐照無遺，萬里情形，洞如觀火。臣才庸識淺，不知輕重緩急，惑於漳、潮壤接，民情疑恐，親赴彈壓。一經聖明詳晰指示，臣自知錯謬，不禁慚悚交集（硃批：此時又當前往，爾等總不知機要，奈何）。茲臣雖未得閩省剿滅逆匪之信，但據報水陸兩提臣齊抵臺灣，逆賊漸已逃竄，自可即日蕩平。臣已於正月二十一日起，先將督標官兵陸續撤回歸五。其先赴閩省之水師一千名，昨准閩浙督臣知會，現在暫駐漳州，用資彈壓。其駐紮黃崗等處水陸兵丁，臣現與署提臣彭承堯商酌，俟再得閩省剿賊確信。察看漳、潮交界處所，民情十分寧貼，亦即分起撤回。惟粵省惠、潮民人入天地會者，諒復不少，此種匪會，現有攻城殺官之事，非別項邪教止圖誆騙錢財者可比，必須徹底查辦，淨絕根株。其從外竄逃入境及內地勾引入會之人，均應一一搜捕，不留餘孽。臬司姚棻現已行調來潮，專司督緝，俟有續獲，另容隨時訊供具奏。一切稽查防範事宜，臣遵旨交與署提臣彭承堯，暫駐潮州督率料理。臣即於正月二十六日起程回省，仍俟續得臺地信息，隨時由驛迅速奏聞。所有臣欽奉諭旨，現在料理撤兵緝匪及起程回省日期，理合由驛四百里覆奏，伏乞皇上睿鑒。謹奏。<br><br>乾隆五十二年正月二十六日<br>乾隆五十二年二月十四日奉硃批：已有旨了。欽此。〔本文原收錄於軍錄】</p>
        </div>
      </div>

      <!-- 左：諭43（上諭，與硃160同尺寸同高度，初始寬度 0，右邊界固定貼齊硃160左邊） -->
      <div class="part1-doc" id="panelYu">
        <div class="part1-doc-head">
          <div class="part1-doc-window-controls">
            <span class="part1-doc-window-btn" aria-hidden="true"><svg class="part1-chat-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg></span>
            <span class="part1-doc-window-btn" aria-hidden="true"><svg class="part1-chat-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
            <span class="part1-doc-window-btn" aria-hidden="true"><svg class="part1-chat-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></span>
          </div>
          <p class="part1-doc-title"><span class="badge">諭</span>諭兩廣總督孫士毅毋庸親往潮州</p>
          <p class="part1-doc-meta">大學士公阿桂、大學士和珅 字寄兩廣總督孫（士毅）<br>發佈 乾隆五十二年正月十三日（1787/01/13）<br>《天地會》1，頁231</p>
        </div>
        <div class="part1-doc-scroll">
          <p class="part1-doc-body" id="yuBody"><mark data-target="a">大學士公阿、大學士和，字寄兩廣總督孫，乾隆五十二年正月十三日奉上諭</mark>：<mark data-target="b">據孫士毅奏，接準閩省諮文，挑備水師戰兵一千名，立即起程，前赴南澳，以資策應。並知會署提臣彭承堯，先赴潮州稽查彈壓</mark>，數日內略爲料理地方事務，即親赴潮州駐紮，以便就近辦理等語，已於折內詳悉批示。<mark data-target="b">閩粵境壤毗連，臺匪糾衆滋事，孫士毅接準諮文，派兵前往預備策應，及嚴飭各隘口，嚴密盤潔，遇有形跡可疑之人，立即究辦。此係當辦之事。</mark>至林爽文不過一烏合之衆，無難速就撲滅。前因該省水陸兩提督概行渡臺，朕尚以爲過當。<mark data-target="b">孫士毅系鄰省總督，止當鎮靜地方，密飭各隘口堵拿逸犯，豈得輕離省城，以致粵東內地民人心懷疑惑。</mark>外省各督撫遇有此等事件，每以親身前往，見其急公，而不權事理之輕重緩急。督撫固不可養尊處優，身耽安逸，然當鎮靜辦理之事，亦不可過涉張皇，斷無因一二賊匪騷動各省之理。<mark data-target="b">著傳諭孫士毅，此時如尚未起程，即毋庸前往。若業已起程，亦即回省城。</mark>潮州現有彭承堯在彼，盡足以資彈壓。若續得閩省臺地信息，即行迅速具奏。將此由六百里加緊諭令知之。欽此。遵旨寄信前來。</p>
        </div>
      </div>

      <span class="hint-bubble" id="hintBubble" aria-hidden="true"><span class="hint-ring"></span>①</span>

    </div>
  </figure>
  </div>
</div>
<script>
  (function () {
    var stage = document.getElementById('stage');
    var zhuPanel = document.getElementById('panelZhu');
    var zhuMarks = Array.prototype.slice.call(document.querySelectorAll('#panelZhu mark[data-hl]'));
    var yuPanel = document.getElementById('panelYu');
    var yuBody = document.getElementById('yuBody');
    var yuBodyHTML = yuBody.innerHTML; // 完整含 <mark> 目標的原始標記，稍後打字結束後還原用
    var hintBubble = document.getElementById('hintBubble');
    var firstReveal = true;

    function clearZhuPicked() {
      zhuMarks.forEach(function (el) { el.classList.remove('is-picked'); });
    }
    function clearYuActive() {
      yuBody.querySelectorAll('mark[data-target]').forEach(function (el) { el.classList.remove('is-active'); });
    }

    function activateTarget(targetKey) {
      clearYuActive();
      var targets = yuBody.querySelectorAll('mark[data-target="' + targetKey + '"]');
      targets.forEach(function (el) {
        el.classList.remove('is-active');
        void el.offsetWidth; // 強制重繪，讓每次點擊都重播一次閃現動畫
        el.classList.add('is-active');
      });
      if (targets.length) targets[0].scrollIntoView({ block: 'center', behavior: 'smooth' });
    }

    function revealYuPanelThenType(targetKey) {
      zhuPanel.classList.add('is-shown');
      yuPanel.classList.add('is-shown');
      window.setTimeout(function () {
        var plain = yuBody.textContent;
        var i = 0;
        yuBody.textContent = '';
        var timer = setInterval(function () {
          i += 6;
          if (i >= plain.length) {
            clearInterval(timer);
            yuBody.innerHTML = yuBodyHTML;
            activateTarget(targetKey);
            return;
          }
          yuBody.textContent = plain.slice(0, i);
        }, 8);
      }, 220);
    }

    function positionHint() {
      if (!hintBubble || !zhuMarks.length) return;
      var first = zhuMarks[0];
      var stageRect = stage.getBoundingClientRect();
      var r = first.getBoundingClientRect();
      hintBubble.style.left = (r.left - stageRect.left) + 'px';
      hintBubble.style.top = (r.top - stageRect.top) + 'px';
    }

    function hideHint() {
      if (!hintBubble) return;
      hintBubble.classList.remove('is-shown');
    }

    zhuMarks.forEach(function (el) {
      el.addEventListener('click', function () {
        var group = el.dataset.hl;
        var targetKey = (group === 'quote') ? 'b' : 'a';

        clearZhuPicked();
        zhuMarks.filter(function (m) { return m.dataset.hl === group; })
          .forEach(function (m) { m.classList.add('is-picked'); });

        hideHint();

        if (firstReveal) {
          firstReveal = false;
          revealYuPanelThenType(targetKey);
        } else {
          activateTarget(targetKey);
        }
      });
    });

    if (zhuMarks.length) {
      positionHint();
      hintBubble.classList.add('is-shown');
      hintBubble.addEventListener('click', function () { zhuMarks[0].click(); });
      window.addEventListener('resize', positionHint);
    }
  })();
</script>
</body>
</html>
